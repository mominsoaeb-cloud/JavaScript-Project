<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countdown_Slideshow</title>
    <link rel="stylesheet" type="text/css" href="CSS/CSS_File.css">
</head>
<body>
    <p>How many seconds between each slide?</p>
    <input id="seconds" type="number" min="1" step="1" value="2" />
    <button onclick="startSlideshow()">Start Slideshow</button>
    <button onclick="pauseSlideshow()">Pause</button>
    <p id="timer" role="status" aria-live="polite">Timer: not started</p>
    <script src="JS/main.js" defer></script>

    <!-- Slideshow container -->
<div class="slideshow-container">

  <!-- Full-width images with number and caption text -->
  <div class="mySlides fade">
    <div class="numbertext">1 / 3</div>
    <img src="img/car1.jpg" style="width:100%">
    <div class="text">Car One</div>
  </div>

  <div class="mySlides fade">
    <div class="numbertext">2 / 3</div>
    <img src="img/car2.jpg" style="width:100%">
    <div class="text">Car Two</div>
  </div>

  <div class="mySlides fade">
    <div class="numbertext">3 / 3</div>
    <img src="img/car3.jpg" style="width:100%">
    <div class="text">Car Three</div>
  </div>

  <!-- Next and previous buttons -->
  <a class="prev" onclick="plusSlides(-1)">&#10094;</a>
  <a class="next" onclick="plusSlides(1)">&#10095;</a>
</div>
<br>

<!-- The dots/circles -->
<div style="text-align:center">
  <span class="dot" onclick="currentSlide(1)"></span>
  <span class="dot" onclick="currentSlide(2)"></span>
  <span class="dot" onclick="currentSlide(3)"></span>
</div>

</body>
</html>
